# ex01（原始 BP）与 taskcon（固定 8 帧 + BP 同任务对比损失）的动作注意力与离线 BP 替换对比。
output_dir: /vla/workspace/my_tbot/tools/bpv3_attn_probe/results/ex01_vs_taskcon
manifest: /vla/workspace/my_tbot/tools/bpv3_encoder_probe/results/ex04_taskcon_stage15_probe/manifest.jsonl

seed: 42
episodes_per_task: 3
progress: [0.1, 0.5, 0.9]
times: [0.9, 0.5, 0.1]

# probe.dataset_cfg 需要的字段；policy 中有的字段以 policy 为准
external_stats_root: /vla/workspace/my_tbot/norm_stats
video_backend: torchcodec
height: 224
width: 224
max_state_dim: 32
max_action_dim: 32
bp_num_chunks: 8
bp_action_chunk_size: 50
bp_action_use: false
bp_state_use: true
bp_camera_keys:
  - observation.images.image0

checkpoints:
