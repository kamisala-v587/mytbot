# RoboTwin clean-only sampling rules.
#
# The framework normalizes group budgets into repo weights whose sum is 1.
# Budgets below are the task-level recommendations normalized by the raw
# recommendation sum: 3*2.0 + 5*1.5 + 11*1.2 + 18*1.0 + 13*0.8 = 55.1.

groups:
  - name: robotwin_clean_weight_2_0
    match: "(?i)/robotwin2\\.0/(turn_switch|hanging_mug|place_can_basket)/[^/]+_clean_[0-9]+$"
    total_weight: 0.10
    inside: uniform

  - name: robotwin_clean_weight_1_5
    match: "(?i)/robotwin2\\.0/(move_stapler_pad|handover_block|pick_diverse_bottles|put_object_cabinet|rotate_qrcode)/[^/]+_clean_[0-9]+$"
    total_weight: 0.13
    inside: uniform

  - name: robotwin_clean_weight_1_2
    match: "(?i)/robotwin2\\.0/(place_mouse_pad|place_object_basket|scan_object|place_dual_shoes|press_stapler|stack_bowls_three|place_object_scale|stamp_seal|blocks_ranking_size|move_can_pot|place_object_stand)/[^/]+_clean_[0-9]+$"
    total_weight: 0.25
    inside: uniform

  - name: robotwin_clean_weight_1_0
    match: "(?i)/robotwin2\\.0/(place_a2b_left|place_fan|stack_blocks_three|place_a2b_right|place_bread_skillet|put_bottles_dustbin|dump_bin_bigbin|move_pillbottle_pad|pick_dual_bottles|place_bread_basket|beat_block_hammer|blocks_ranking_rgb|click_bell|click_alarmclock|place_burger_fries|place_cans_plasticbox|place_phone_stand|place_empty_cup)/[^/]+_clean_[0-9]+$"
    total_weight: 0.32
    inside: uniform

  - name: robotwin_clean_weight_0_8
    match: "(?i)/robotwin2\\.0/(adjust_bottle|grab_roller|move_playingcard_away|open_microwave|shake_bottle|shake_bottle_horizontally|handover_mic|lift_pot|open_laptop|place_container_plate|place_shoe|stack_blocks_two|stack_bowls_two)/[^/]+_clean_[0-9]+$"
    total_weight: 0.20
    inside: uniform

default:
  total_weight: 0.0
  inside: uniform
  on_match: error
